plugins {
    id 'java'
	// For source code formatting
	id "com.diffplug.spotless" version "8.10.3"
    // Download task
    id "de.undercouch.download" version "5.7.0"
	// Shadow
	id "com.gradleup.shadow" version "9.4.3"
}

/**
 * Project Properties
 */
ext {
	buildID = System.getenv( 'BUILD_ID' ) ?: '0'
	branch = System.getenv( 'BRANCH' ) ?: 'development'
}

if ( branch == 'development' ) {
    // If the branch is 'development', ensure the version ends with '-snapshot'
    // This replaces any existing prerelease identifier with '-snapshot'
    version = version.contains('-') ? version.replaceAll(/-.*/, '-snapshot') : "${version}-snapshot"
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
	// Includes BoxLang + SLF4J + AWS Lambda Core
	implementation 'io.boxlang:boxlang-aws-lambda:' + boxlangVersion

    // Use only one SLF4J implementation to avoid warnings
	testImplementation( 'org.slf4j:slf4j-nop:2.0.18' ) {
		// Exclude to avoid conflicts with BoxLang's SLF4J binding
		exclude group: 'org.slf4j', module: 'slf4j-api'
	}
	// Jackson for JSON parsing in local testing
	testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.21.+'

	// Testing Frameworks
    testImplementation "org.junit.jupiter:junit-jupiter:6.+"
	testImplementation "org.mockito:mockito-core:5.+"
	testImplementation "com.google.truth:truth:1.+"
	// Explicitly declare the JUnit platform launcher (to avoid deprecation)
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

java {
	sourceCompatibility = JavaVersion.toVersion( jdkVersion )
	targetCompatibility = JavaVersion.toVersion( jdkVersion )
}

compileJava {
	// Compiler Options
	options.incremental = true
	options.encoding = 'UTF-8'
	options.debug = true
}

compileTestJava {
}

test {
	dependsOn 'generateManifest'
    useJUnitPlatform()
    testLogging {
		showStandardStreams = true
	}
}

jar {
    archiveVersion =  "${version}"
 	manifest {
	   attributes 'Description': 'My BoxLang AWS Lambda Runtime'
    }
}
shadowJar {
	mergeServiceFiles()
    destinationDirectory = file( "build/distributions" )
}

/**
 * Generate manifest.json from src/main/bx/handlers/ so the runtime never has to
 * scan the filesystem for routable handlers at cold start - it just reads this
 * file. Regenerated automatically before packaging and before every local run,
 * so it can never silently drift from what's actually in handlers/.
 *
 * Directory segments become route-key segments as-is, lowercased; only the leaf
 * .bx filename is expected to be PascalCase. handlers/api/Test.bx -> "api/test".
 */
task generateManifest {
	description = 'Generates manifest.json from src/main/bx/handlers/'

	def handlersDir	= file( 'src/main/bx/handlers' )
	def outputFile		= file( 'src/main/bx/manifest.json' )

	inputs.files( fileTree( handlersDir ) { include '**/*.bx' } ).skipWhenEmpty( false )
	outputs.file( outputFile )

	doLast {
		def handlers = [:]

		def scan
		scan = { File dir, String prefix ->
			dir.eachFile { entry ->
				if ( entry.isDirectory() ) {
					def subPrefix = prefix ? "${prefix}/${entry.name.toLowerCase()}" : entry.name.toLowerCase()
					scan( entry, subPrefix )
				} else if ( entry.name.toLowerCase().endsWith( '.bx' ) ) {
					def fileKey		= entry.name[ 0..-4 ].toLowerCase()
					def routeKey	= prefix ? "${prefix}/${fileKey}" : fileKey
					def relative	= handlersDir.toPath().relativize( entry.toPath() ).toString().replace( File.separator, '/' )
					handlers[ routeKey ] = relative
				}
			}
		}

		if ( handlersDir.exists() ) {
			scan( handlersDir, '' )
		}

		def handlersJson = handlers.collect { key, path ->
			"\t\t\"${key}\": { \"file\": \"handlers/${path}\" }"
		}.join( ",\n" )

		outputFile.parentFile.mkdirs()
		outputFile.text = """{
	"manifestVersion": 1,
	"generatedAt": "${java.time.Instant.now()}",
	"generator": "boxlang-starter-aws-lambda-gradle",
	"defaultHandler": { "file": "Lambda.bx", "method": "run" },
	"handlers": {
${handlersJson}
	},
	"reserved": ["Application.bx", "Lambda.bx"]
}
"""
		println "📋 Generated manifest.json with ${handlers.size()} handler(s): ${handlers.keySet()}"
	}
}

/**
 * Build the Lambda zip file for deployment on AWS
 */
task buildLambdaZip( type: Zip ) {
	dependsOn generateManifest
	archiveFileName = "${project.name}-${version}.zip"

	// Add Lambda.bx to the root of the ZIP
	from( 'src/main/bx' ) {
		into ''
	}

	// Add boxlang.json to the root of the ZIP
    from( 'src/resources/boxlang.json' ) {
        into '' // Ensure it's placed in the root
    }

	// Add BoxLang Modules
    from( 'src/resources/boxlang_modules/' ) {
        into 'boxlang_modules/'
    }

	// Include dependencies inside the `lib/` folder
	into( 'lib' ) {
		// All the Jars in the src/test/resources/libs directory
		from 'src/test/resources/libs'
		from shadowJar.outputs.files
	}
}
shadowJar.finalizedBy( buildLambdaZip )

/**
 * Task to download the latest jar from https://ortus-temp.s3.amazonaws.com/jericho/libs/boxlang-1.0.0.jar
 * You can also move this to maven if you want.
 */
task downloadBoxLang( type: Download ) {
	dependsOn( 'processTestResources' )
	// Create the destination directory
	doFirst {
		file( "src/resources/libs" ).mkdirs()
	}

    // Configure the URL of the file to download
	src "https://s3.amazonaws.com/downloads.ortussolutions.com/ortussolutions/boxlang-runtimes/boxlang-aws-lambda/${boxlangVersion}/boxlang-aws-lambda-${boxlangVersion}.jar"

	// Specify the destination directory for the downloaded file
    dest "src/resources/libs/boxlang-aws-lambda-${boxlangVersion}.jar"
    overwrite true
    onlyIfModified false
}

/**
 * Project Wide Helper function
 * This is not a task, but a reusable UDF
 */
project.ext.bumpVersion = { boolean major = false, boolean minor = false, boolean patch = false ->

	def propertiesFile = file( './gradle.properties' );
	def properties = new Properties();

	properties.load( propertiesFile.newDataInputStream() )
	def versionTarget = major ? 0 : minor ? 1 : 2

	def currentVersion = properties.getProperty( 'version' )
	def versionParts = currentVersion.split( '\\.' )
	def newPathVersion = versionParts[ versionTarget ].toInteger() + 1
	def newVersion = '';

	if( patch ){
		newVersion = "${versionParts[ 0 ]}.${versionParts[ 1 ]}.${newPathVersion}"
	} else if( minor ){
		newVersion = "${versionParts[ 0 ]}.${newPathVersion}.0"
	} else if( major ){
		newVersion = "${newPathVersion}.0.0"
	}

	properties.setProperty( 'version', newVersion )
	properties.store( propertiesFile.newWriter(), null )

	println "Bumped version from ${currentVersion} to ${newVersion}"
}
/**
 * Bump the major version number
 */
task bumpMajorVersion {
	doLast{
		bumpVersion( true )
	}
}

/**
 * Bump the minor version number
 */
task bumpMinorVersion {
	doLast{
		bumpVersion( false, true )
	}
}

/**
 * Bump the patch version number
 */
task bumpPatchVersion {
	doLast{
		bumpVersion( false, false, true )
	}
}

/**
 * Run Lambda locally with default event used for integration testing
 * worbench/sampleEvents/event-local.json
 */
task runLocal( type: JavaExec ) {
	dependsOn compileTestJava, generateManifest
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.myproject.runner.LocalLambdaRunner'

	// Set default event file
	systemProperty 'eventFile', project.findProperty('eventFile') ?: 'workbench/sampleEvents/event-local.json'

	// Force JVM exit after execution to prevent hanging
	systemProperty 'java.awt.headless', 'true'
	jvmArgs = ['-Djava.awt.headless=true']

	doFirst {
		println "🚀 Running BoxLang Lambda locally..."
		if (project.hasProperty('eventFile')) {
			println "📄 Using event file: ${project.getProperty('eventFile')}"
		}
	}
}

/**
 * Run Lambda locally with API Gateway event
 */
task runLocalApi( type: JavaExec ) {
	dependsOn compileTestJava, generateManifest
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.myproject.runner.LocalLambdaRunner'
	systemProperty 'eventFile', 'workbench/sampleEvents/api.json'

	// Force JVM exit after execution to prevent hanging
	systemProperty 'java.awt.headless', 'true'
	jvmArgs = ['-Djava.awt.headless=true']

	doFirst {
		println "🚀 Running BoxLang Lambda locally with API Gateway event..."
	}
}

/**
 * Run Lambda locally with legacy API Gateway event
 */
task runLocalLegacy( type: JavaExec ) {
	dependsOn compileTestJava, generateManifest
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.myproject.runner.LocalLambdaRunner'
	systemProperty 'eventFile', 'workbench/sampleEvents/event.json'

	// Force JVM exit after execution to prevent hanging
	systemProperty 'java.awt.headless', 'true'
	jvmArgs = ['-Djava.awt.headless=true']

	doFirst {
		println "🚀 Running BoxLang Lambda locally with Legacy API Gateway event..."
	}
}

/**
 * Start SAM local API server for HTTP endpoint testing
 */
task startSamServer( type: Exec ) {
	dependsOn build

	// Check if SAM CLI is available
	doFirst {
		try {
			exec {
				commandLine 'sam', '--version'
				standardOutput = new ByteArrayOutputStream()
				errorOutput = new ByteArrayOutputStream()
			}
		} catch (Exception e) {
			throw new GradleException("""
❌ SAM CLI not found! Please install it first:

🍺 macOS (Homebrew):
   brew install aws-sam-cli

🐧 Linux:
   pip install aws-sam-cli

🪟 Windows:
   Download from: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/install-sam-cli.html

ℹ️  Alternative: Use ./gradlew runLocal for non-HTTP testing
			""".stripIndent())
		}

		println "🌐 Starting SAM local API server..."
		println "📍 Your Lambda will be available at: http://localhost:3000"
		println "🔄 Building project first..."
	}

	workingDir 'workbench'
	commandLine 'sam', 'local', 'start-api',
		'--template', 'template-local.yml',
		'--port', '3000',
		'--host', '0.0.0.0'

	// Show helpful output
	doLast {
		println ""
		println "✅ SAM server should now be running!"
		println "🧪 Test your endpoints with:"
		println "   curl http://localhost:3000"
		println "   curl -X POST http://localhost:3000 -d '{\"test\":\"data\"}' -H 'Content-Type: application/json'"
	}
}

/**
 * Start SAM local API server in background (daemon mode)
 */
task startSamServerBackground( type: Exec ) {
	dependsOn build

	doFirst {
		// Check if server is already running
		try {
			def response = new URL("http://localhost:3000").getText()
			println "⚠️  Server already running at http://localhost:3000"
			println "🛑 Stop it first with: ./gradlew stopSamServer"
			throw new GradleException("SAM server already running")
		} catch (ConnectException e) {
			// Good, port is available
			println "🌐 Starting SAM local API server in background..."
		}

		// Create logs directory
		file('build/sam-logs').mkdirs()
	}

	workingDir 'workbench'
	commandLine 'bash', '-c', '''
		nohup sam local start-api \
			--template template-local.yml \
			--port 3000 \
			--host 0.0.0.0 \
			> ../build/sam-logs/sam-server.log 2>&1 &
		echo $! > ../build/sam-logs/sam-server.pid
	'''

	doLast {
		// Wait a moment and check if server started
		Thread.sleep(3000)
		try {
			new URL("http://localhost:3000").getText()
			println "✅ SAM server started in background!"
			println "📍 Available at: http://localhost:3000"
			println "📄 Logs: build/sam-logs/sam-server.log"
			println "🛑 Stop with: ./gradlew stopSamServer"
		} catch (Exception e) {
			println "⚠️  Server may still be starting... check build/sam-logs/sam-server.log"
		}
	}
}

/**
 * Stop the background SAM server
 */
task stopSamServer {
	doLast {
		def pidFile = file('build/sam-logs/sam-server.pid')
		if (pidFile.exists()) {
			def pid = pidFile.text.trim()
			println "🛑 Stopping SAM server (PID: $pid)..."

			try {
				exec {
					commandLine 'kill', pid
				}
				pidFile.delete()
				println "✅ SAM server stopped"
			} catch (Exception e) {
				println "⚠️  Could not stop server (may already be stopped)"
				println "🔍 Check manually: ps aux | grep sam"
			}
		} else {
			println "ℹ️  No SAM server PID file found"
			println "🔍 Check if server is running: curl http://localhost:3000"
		}
	}
}
